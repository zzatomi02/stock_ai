spring:
  application:
    name: stock-trading-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Seoul

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    permit-all: ${APP_SECURITY_PERMIT_ALL:false}
    swagger-enabled: ${APP_SWAGGER_ENABLED:false}
    username: ${APP_SECURITY_USERNAME:ops}
    password: ${APP_SECURITY_PASSWORD:change-me}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
