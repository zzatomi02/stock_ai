# P6SpyFactory(드라이버·코어) + P6LogFactory(SQL 로깅 모듈). 후자가 없으면 P6LogOptions가 등록되지 않아 statement 로그가 전혀 안 남음.
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
appender=com.p6spy.engine.spy.appender.Slf4JLogger
# P6Spy가 내부에서 실제 MySQL 드라이버를 등록·위임하도록 지정(미지정 시 환경에 따라 쿼리가 안 잡힐 수 있음)
driverlist=com.mysql.cj.jdbc.Driver

# 보기 좋은 커스텀 포맷 (한 줄)
# - effectiveSql*: 드라이버에 전달되는 원문(PreparedStatement는 ? 유지)
# - sql / sqlSingleLine: 바인딩 값이 치환된 SQL (파라미터까지 보이게 하려면 sqlSingleLine 사용)
# 참고: CustomLineFormat은 Logback/Slf4J용 %n(개행)을 해석하지 않으므로 한 줄 포맷 사용
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=[P6SPY] | %(currentTime) | %(executionTime) ms | %(category) | conn=%(connectionId) | %(sqlSingleLine)

# 잡음 로그는 제외 (statement, commit, rollback 은 남음)
excludecategories=info,debug,result,resultset,batch
