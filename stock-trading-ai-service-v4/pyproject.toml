[project]
name = "stock-trading-ai-service-v4"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "numpy>=2.1.0",
  "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
